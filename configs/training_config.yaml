# Training Configuration for PaulG-LM

model:
  name: "LiquidAI/LFM2.5-230M"
  max_length: 512

stage1_cpt:
  output_dir: "models/pg-stage1"
  adapter_name: "pg-stage1-adapter"
  num_train_epochs: 1
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2e-4
  warmup_steps: 100
  logging_steps: 10
  save_steps: 500
  fp16: true
  data_file: "data/processed/train_cpt.txt"

stage2_sft:
  output_dir: "models/pg-stage2"
  adapter_name: "pg-stage2-adapter"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2e-4
  warmup_steps: 100
  logging_steps: 10
  save_steps: 500
  fp16: true
  train_file: "data/processed/train.jsonl"
  val_file: "data/processed/val.jsonl"

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.1
  bias: "none"
  target_modules: ["q_proj", "v_proj", "k_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

generation:
  max_new_tokens: 256
  temperature: 0.9
  top_k: 50

evaluation:
  test_questions: "data/eval/test_questions.jsonl"
  models_to_compare:
    - "stage1_only"
    - "stage2_only"
    - "base"
    - "base_sys_prompt"
    - "base_sys_10examples"
    - "paulgllm"
